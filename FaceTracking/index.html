<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/"
        }
      }
    </script>
    <script src="./libs/mindar/mindar-face-three.prod.js"></script>
    <script src="./main.js" type="module"></script>
    <link rel="stylesheet" href="./styles.css">
    <title>Face Tracking AR</title>
</head>
<body>
    <div id="mask-selector">
        <div class="panel-header">
            <div class="panel-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                    <circle cx="9" cy="10" r="1.5" fill="currentColor" stroke="none"/>
                    <circle cx="15" cy="10" r="1.5" fill="currentColor" stroke="none"/>
                    <path d="M8 15s1.5 2 4 2 4-2 4-2"/>
                </svg>
            </div>
            <span class="panel-title">AR Masks</span>
        </div>

        <div class="masks-list">
            <button id="btn-freddy" class="mask-btn active">
                <div class="mask-img-wrap">
                    <img src="./logos/freedieLogo.png" alt="Freddy">
                </div>
                <div class="mask-info">
                    <span class="mask-name">Freddy</span>
                    <span class="mask-sub">Bear Mask</span>
                </div>
                <div class="mask-active-dot"></div>
            </button>

            <button id="btn-batman" class="mask-btn">
                <div class="mask-img-wrap">
                    <img src="./logos/batmanLogo.png" alt="Batman">
                </div>
                <div class="mask-info">
                    <span class="mask-name">Batman</span>
                    <span class="mask-sub">Hero Mask</span>
                </div>
                <div class="mask-active-dot"></div>
            </button>
        </div>

        <button id="switch" class="switch-btn" title="Switch Camera">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 7h-3.5l-1.5-2H9L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="13" r="3"/>
                <path d="M18 4l2 2-2 2"/>
                <path d="M6 4L4 6l2 2"/>
            </svg>
            <span>Flip Camera</span>
        </button>
    </div>
</body>
</html>
